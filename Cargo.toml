[package]
name = "neural_engine"
version = "0.1.0"
edition = "2024"
[lib]
name = "neural_engine"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.17.2"
rand = "0.10.1"
rand_distr = "0.6.0"
pyo3 = { version = "0.28.3", features = ["extension-module"] }
numpy = "0.28.0"
rayon = "1.8"
blas-src = { version = "0.14.0", features = ["openblas"] }
openblas-src = { version = "0.10", features = ["system", "cblas"] }
